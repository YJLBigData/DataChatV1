# ----------------------------------------------------------------
# 计算/对比口径（同比、环比、占比、Top N、累计）
# ----------------------------------------------------------------
calculations:
  yoy_growth:
    label: 同比增长
    aliases: [同比, 同比增长率, 同比增速]
    formula: "(本期 - 去年同期) / 去年同期"
  mom_growth:
    label: 环比增长
    aliases: [环比, 环比增长率]
    formula: "(本期 - 上月) / 上月"
  ratio:
    label: 占比
    aliases: [占比, 比例, 比重]
    formula: "分组金额 / 总金额"
  rank:
    label: 排名
    aliases: [排名, 排行, TopN, 前几名, 后几名]
  trend:
    label: 趋势
    aliases: [趋势, 走势, 变化]
  delta:
    label: 差值
    aliases: [差值, 差距, 差额]
  cumulative:
    label: 累计
    aliases: [累计, 累积, 累计至今]

# ----------------------------------------------------------------
# 表关联 joins（仅当跨表分析时启用）
# ----------------------------------------------------------------
joins:
  summary_target:
    left: ads_bi_month_shop_item_dan_summary_df
    right: ads_bi_month_shop_item_dan_target_summary_df
    on:
      - [year, year]
      - [month, month]
      - [lev2_name, lev2_name]
      - [lev3_name, lev3_name]
      - [big_system_channel_name, big_system_channel_name]
    notes: 用于"销售实绩 vs 目标 / 达成率"的对比分析
    safe: true

  summary_member:
    left: ads_bi_month_shop_item_dan_summary_df
    right: ads_member_first_purchase_new_customer_total_df
    on:
      - [year, year]
      - [month, month]
      - [lev2_name, lev2_name]
      - [lev3_name, lev3_name]
      - [big_system_channel_name, big_system_channel_name]
      - [item_dan_name, item_dan_name]
    notes: 销售额结合新客人数分析
    safe: true

  summary_potential:
    left: ads_bi_month_shop_item_dan_summary_df
    right: ads_precision_nutrition_potential_total_df
    on:
      - [year, year]
      - [month, month]
      - [lev2_name, lev2_name]
      - [lev3_name, lev3_name]
      - [big_system_channel_name, big_system_channel_name]
    notes: 销售结合潜客分析
    safe: true

# ----------------------------------------------------------------
# Few-shot 示例（高质量问答样本）
# ----------------------------------------------------------------
few_shots:
  - question: 本月销售额是多少
    intent:
      metric: terminal_sale_amount_total
      time_range:
        kind: relative
        period: this_month
      group_by: []
    sql_hint: |
      SELECT SUM(terminal_sale_amount) AS terminal_sale_amount_total
      FROM ads_bi_month_shop_item_dan_summary_df
      WHERE year='2026' AND month='04'

  - question: 各大区销售额排名
    intent:
      metric: terminal_sale_amount_total
      time_range:
        kind: relative
        period: this_month
      group_by: [region]
      order_by: [{field: terminal_sale_amount_total, dir: desc}]
    sql_hint: |
      SELECT lev2_name AS region, SUM(terminal_sale_amount) AS terminal_sale_amount_total
      FROM ads_bi_month_shop_item_dan_summary_df
      WHERE year='2026' AND month='04'
      GROUP BY lev2_name
      ORDER BY terminal_sale_amount_total DESC
      LIMIT 100

  - question: 东一区 1 季度销售情况
    intent:
      metric: terminal_sale_amount_total
      time_range:
        kind: absolute
        year: '2026'
        months: ['01','02','03']
      filters:
        region: 东一区
      group_by: [month]
    sql_hint: |
      SELECT month, SUM(terminal_sale_amount) AS terminal_sale_amount_total
      FROM ads_bi_month_shop_item_dan_summary_df
      WHERE year='2026' AND month IN ('01','02','03') AND lev2_name='东一区'
      GROUP BY month
      ORDER BY month

  - question: 1 段产品的销售情况
    intent:
      metric: terminal_sale_amount_total
      time_range:
        kind: relative
        period: this_month
      filters:
        item_dan: 1段
      group_by: [region]

  - question: 销售目标完成的怎么样
    intent:
      metric: shop_sale_achievement_rate
      time_range:
        kind: relative
        period: this_month
      group_by: [region]

  - question: 各大区销售同比情况
    intent:
      metric: terminal_sale_amount_total
      calculation: yoy_growth
      time_range:
        kind: relative
        period: this_month
      group_by: [region]

  - question: 这个月新客人数是多少
    intent:
      metric: first_purchase_num_total
      time_range:
        kind: relative
        period: this_month

  - question: 各大区 60 天复购率
    intent:
      metric: repurchase_rate_60d
      time_range:
        kind: relative
        period: this_month
      group_by: [region]

  - question: 卓睿系列卖得怎么样
    intent:
      metric: terminal_sale_amount_total
      time_range:
        kind: relative
        period: this_month
      filters:
        item_series: 卓睿

  - question: 终端销售排名前 5 的城市
    intent:
      metric: terminal_sale_amount_total
      time_range:
        kind: relative
        period: this_month
      group_by: [city]
      order_by: [{field: terminal_sale_amount_total, dir: desc}]
      limit: 5

  - question: 各大区终端销售金额和还原过单金额差异多少？差异最大的前 10 个大区
    intent:
      metric: terminal_sale_amount_total
      extra_metrics: [reduction_gd_sale_amount_total]
      time_range:
        kind: relative
        period: this_month
      group_by: [region]
      calculation: rank
      order_by: [{field: terminal_sale_amount_total, dir: desc}]
      limit: 10
    sql_hint: |
      -- 两个指标都 SELECT，answerer 在 narrative 阶段算差值并按差值重排
      SELECT lev2_name AS region,
             SUM(terminal_sale_amount) AS terminal_sale_amount_total,
             SUM(reduction_gd_sale_amount) AS reduction_gd_sale_amount_total
      FROM ads_bi_month_shop_item_dan_summary_df
      WHERE year='2026' AND month='04'
      GROUP BY lev2_name
      ORDER BY terminal_sale_amount_total DESC
      LIMIT 10
    notes: |
      "两个指标的差值/绝对值"类问题，不要 needs_clarify。
      QueryPlan 的 order_by 不接受衍生表达式，但只要把两个指标都 SELECT 出来（metric +
      extra_metrics），answerer 拿到的数据足以算差值并按差值描述前 N。

  - question: 销售额前 10 的门店
    intent:
      metric: terminal_sale_amount_total
      time_range:
        kind: relative
        period: this_month
      group_by: [shop]
      order_by: [{field: terminal_sale_amount_total, dir: desc}]
      limit: 10
    sql_hint: |
      -- 门店级粒度必须用 detail 表，summary 表不到门店级
      SELECT shop_code, shop_name, SUM(terminal_sale_amount) AS terminal_sale_amount_total
      FROM ads_bi_month_shop_item_dan_detail_df
      WHERE year='2026' AND month='04'
      GROUP BY shop_code, shop_name
      ORDER BY terminal_sale_amount_total DESC
      LIMIT 10
    notes: 涉及"门店"维度必须切到 ads_bi_month_shop_item_dan_detail_df，summary 表没有 shop_code/shop_name

  - question: 河南省销售额按城市拆分
    intent:
      metric: terminal_sale_amount_total
      time_range:
        kind: relative
        period: this_month
      filters:
        province: 河南省
      group_by: [city]
      order_by: [{field: terminal_sale_amount_total, dir: desc}]
    sql_hint: |
      -- province 维度只在 detail 表存在
      SELECT city, SUM(terminal_sale_amount) AS terminal_sale_amount_total
      FROM ads_bi_month_shop_item_dan_detail_df
      WHERE year='2026' AND month='04' AND province='河南省'
      GROUP BY city
      ORDER BY terminal_sale_amount_total DESC
    notes: |
      province（行政省）与 sub_region（飞鹤内部省区）是两个不同的维度。province 只在 detail 表。
      用户问"河南省/广东省/山东省"等行政省时用 detail.province；问"豫北/粤东/苏中"等飞鹤省区时用 sub_region(lev3_name)。

  - question: 各销售代表动销率排名
    intent:
      metric: person_dynamic_sales_rate
      time_range:
        kind: relative
        period: this_month
      group_by: [salesperson]
      order_by: [{field: person_dynamic_sales_rate, dir: desc}]
    sql_hint: |
      -- 人员粒度只在 ads_bi_awake_person_index_summary_df；动销率=动销门店/允销门店，按分子分母之和聚合
      SELECT person_code, person_name AS salesperson,
             SUM(dynamic_sales_shop_qty) / NULLIF(SUM(allow_sales_shop_qty), 0) AS person_dynamic_sales_rate
      FROM ads_bi_awake_person_index_summary_df
      WHERE acc_month='2026-06' AND person_code IS NOT NULL
      GROUP BY person_code, person_name
      ORDER BY person_dynamic_sales_rate DESC
    notes: 涉及"销售代表/业务员/人员/动销率/双萃/启萃/鹤礼3新客达成率/企微/通路活动/妈妈爱"一律切到人员表。

  - question: 徐州中地区各销售代表的鹤礼3新客达成率
    intent:
      metric: person_heli3_new_achieve_rate
      time_range:
        kind: relative
        period: this_month
      filters:
        district: 徐州中
      group_by: [salesperson]
    notes: 鹤礼3新客达成率分子用 heli3_num_brand(品牌品)，与生产口径一致。

  - question: 各大区双萃销售金额
    intent:
      metric: person_jc_qc_sale_amount
      time_range:
        kind: relative
        period: this_month
      group_by: [region]

