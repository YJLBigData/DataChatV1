# DataChat 业务语义层（基于飞鹤生产库 hs_poc 真实 6 张智能问数表手工建模）
# ============================================================
# 设计原则：
# 1) 指标 metric 是用户口语的"业务量"，绑定唯一表达式与所属表
# 2) 维度 dimension 是分析切面，明确字段、值域示例、解释
# 3) 字典 value_dict 把数据库里的代码值翻译为业务术语
# 4) Join 关系仅在确实需要跨表分析时定义，且只允许等值连接
# 5) 任何字段必须满足"哪一张表的哪一列、什么含义、是否权限敏感"
#
# 数据范围口径（按 ads_bi_month_shop_item_dan_summary_df 在生产 hs_poc 的真实数据）：
#   月度汇总/明细：    2025-01 ~ 2026-05
#   月度目标：         2026-01 ~ 2026-05
#   首购新客（历史）：  2017-04 ~ 2026-05
#   精准营养潜客：     2022-02 ~ 2026-05
#   火山POC 销售明细： 2025-01 ~ 2026-05
#
# 数据库 schema 由环境变量 MYSQL_DATABASE / DB_NAME 在运行时注入
# （本地 dev = chatbi，生产 = hs_poc）；下面 schema 字段只作为本地兜底。
# ============================================================

version: 2
profile: chatbi
default_time_grain: month
# 这份 semantic.yaml 是按生产 6 张表逐字段人工建模并核对过的，整体视为"已认证"。
# 未显式标 status 的表/维度/指标都按 verified 加载（planner 会优先信任，减少无谓澄清）；
# 通过后台「自动分析」起草的新条目仍会显式写 status: draft，保留人工认证工作流。
default_entity_status: verified
data_range:
  earliest: "2025-01"
  latest: "2026-05"

# ----------------------------------------------------------------
# 数据表 tables
# ----------------------------------------------------------------
tables:

  ads_bi_hs_sale_info_df:
    label: 火山POC明细销售
    schema: chatbi
    grain: 单据明细（月-门店-导购-产品）
    description: |
      最细粒度的销售明细表。按会计月（acc_month）记录每个门店、导购、产品的销售数量与金额。
      支持下钻到导购、门店、产品规格层级。当用户问"门店级"、"导购级"、"具体产品规格"时优先用这张表。
    time_field: acc_month
    time_format: "YYYY-MM"
    primary_dimensions:
      - region
      - sub_region
      - city
      - channel_type
      - shop_type
      - dealer
      - shop
      - guide
      - item_series_new
      - item_stage
      - item_spec
      - item
    measures:
      - shop_sale_qty_total
      - shop_sale_amount_total
      - gd_amount_total
    notes:
      - shop_sale_qty 是销售件数；shop_sale_amount 是销售金额（元）
      - gd_amount 是过单金额（向经销商订货）；与 shop_sale_amount 含义不同
      - 该表保留分区字段 ds，无需用户感知

  ads_bi_month_shop_item_dan_summary_df:
    label: 月度门店段位汇总
    schema: chatbi
    grain: 月-大区-省区-城市-渠道-系列-段位-圈层
    description: |
      管理层日常使用的核心销售汇总表（生产 1.3M 行，2025-01 ~ 2026-05）。按月度聚合到
      大区/省区/城市/大系统渠道/产品系列/段位/圈层，包含还原过单额与终端销售额。
      99% 的高管问题（"东一区销售怎么样"、"卓睿系列卖得好不好"）应该首选这张表。
      不到门店级别——要看具体门店/导购请用 ads_bi_month_shop_item_dan_detail_df。
    time_field_year: year
    time_field_month: month
    time_format: "YYYY + MM 两列拼成 YYYY-MM"
    primary_dimensions:
      - region
      - sub_region
      - city
      - big_system_channel
      - item_series
      - item_dan
      - terminal_circle
    measures:
      - terminal_sale_amount_total
      - reduction_gd_sale_amount_total
    notes:
      - terminal_sale_amount = 终端实际卖给消费者的金额，是高管最关心的"销售额"
      - reduction_gd_sale_amount = 还原过单金额（不含货补），衡量经销商订货
      - year 和 month 都是字符串字段，month 是两位 "01"-"12"
      - 与 target 表通过 (year, month, lev2_name, lev3_name, big_system_channel_name) 关联做达成率

  ads_bi_month_shop_item_dan_detail_df:
    label: 月度门店段位明细
    schema: chatbi
    grain: 月-大区-省区-地区-省份-城市-门店-连锁系统-渠道-系列-段位-品类
    description: |
      summary 表的门店级明细版（生产千万行级，按 year+month 会计月）。在 summary 维度之上
      多了 shop_code/shop_name/province，以及 lev4_name(地区)、chainstore(连锁系统)、
      channel(渠道等级)、terminal_circle_level(当前快照=品牌品/流通品)，并带 terminal_sale_amount
      的月日均 / 前三月日均预计算列。当用户问"具体哪家门店"、"门店排名"、"某省/某地区下钻"、
      "门店级业绩"、"某连锁系统"、"品牌品/流通品"、"门店日均销售"时选这张表；只问大区/省区/城市
      层面仍优先 summary。
    time_field_year: year
    time_field_month: month
    time_format: "YYYY + MM 两列拼成 YYYY-MM"
    primary_dimensions:
      - region
      - sub_region
      - district
      - province
      - city
      - shop
      - chainstore
      - big_system_channel
      - channel_grade
      - item_series
      - item_dan
      - product_tier
    measures:
      - terminal_sale_amount_total
      - reduction_gd_sale_amount_total
      - terminal_sale_amount_avg_day
      - terminal_sale_amount_before_3m_avg_day
    notes:
      - 金额口径与 summary 一致（terminal_sale_amount 终端销售额、reduction_gd_sale_amount 还原过单），只是粒度更细（含 shop_code/shop_name/province/lev4_name 地区/连锁系统）。
      - 行数远大于 summary——只在确实需要门店/地区/连锁/品类级时才用，避免无谓全表扫描。
      - terminal_circle_level 列在当前快照取值为 品牌产品/流通产品（产品品类，见 product_tier 维度），与 summary 表的"圈层等级"(潜力终端/平台型…)口径不同；按品牌品/流通品筛选用 product_tier。
      - channel_type/channel_name(渠道等级/渠道名称，如 SC) 与火山POC表的 channel_type 代码(母婴店/KA…)不是一回事，勿混用。
      - terminal_sale_amount_month_avg_day(月日均)、terminal_sale_amount_before_mar_avg_day(前三月日均) 为预计算列，可加和。
      - 保留分区字段 ds（MySQL 仅同步最新一份），无需用户感知，也不要按 ds 过滤。

  ads_bi_month_shop_item_dan_target_summary_df:
    label: 月度门店段位目标汇总
    schema: chatbi
    grain: 月-省区-渠道
    description: |
      管理层下达的销售目标与过单目标。该表本身存放目标值与达成实绩，配合 summary 表算达成率。
      注意维度比 summary 表少：没有城市、段位、圈层维度。
    time_field_year: year
    time_field_month: month
    primary_dimensions:
      - region
      - sub_region
      - big_system_channel
    measures:
      - shop_sale_target_total
      - shop_sale_amount_actual_total
      - gd_target_total
      - gd_amount_actual_total
    notes:
      - shop_sale_target = 门店销售目标；shop_sale_amount = 实际门店销售金额（与 summary 表口径一致）
      - gd_target = 过单目标；gd_amount = 实际过单金额
      - 计算"达成率"必须用 actual / target

  ads_member_first_purchase_new_customer_total_df:
    label: 首购新客与复购数据
    schema: chatbi
    grain: 月-省区-渠道-段位
    description: |
      新客首购、60天复购、鹤礼3.0新客与复购汇总。用于会员/新客增长分析。
      不含金额，仅人数指标。
    time_field_year: year
    time_field_month: month
    primary_dimensions:
      - region
      - sub_region
      - big_system_channel
      - item_dan
    measures:
      - first_purchase_num_total
      - repurchase_in_60_days_num_total
      - heli30_new_customer_num_total
      - heli30_repurchase_in_60_days_num_total
    notes:
      - 不要把"新客"和"潜客"混淆，潜客在 ads_precision_nutrition_potential_total_df

  ads_precision_nutrition_potential_total_df:
    label: 精准营养潜客数据
    schema: chatbi
    grain: 月-省区-渠道
    description: |
      精准营养项目的潜客与转化人数。用于营销转化分析。
    time_field_year: year
    time_field_month: month
    primary_dimensions:
      - region
      - sub_region
      - big_system_channel
    measures:
      - potential_num_total
      - potential_to_new_num_total
    notes:
      - potential_num = 精准潜客人数；potential_to_new_num = 转化为新客的人数

  ads_bi_awake_person_index_summary_df:
    label: 激活一线人员指标汇总
    schema: chatbi
    grain: 人员（大区-省区-地区-销售代表）× 会计月
    description: |
      "激活一线"业务的人员（销售代表）月度指标汇总表（按 acc_month 会计月，一线人员一人一行）。
      覆盖动销、终端销售/达成、过单/达成、鹤礼3新客与复购、婴配粉首购、双萃(jc_qc)、启萃、
      终身利益绑定、企微运营、通路活动 / 妈妈爱活动等全口径一线作战指标。
      当用户问到"销售代表 / 业务员 / 某个人名 / 人员岗位"，或问"动销率 / 鹤礼3新客 / 双萃 / 启萃 /
      企微 / 通路活动 / 妈妈爱"这些一线专属指标时，用这张表（其它销售表都不到人员粒度、也没有这些指标）。
    time_field: acc_month
    time_format: "YYYY-MM"
    primary_dimensions:
      - region
      - sub_region
      - district
      - salesperson
      - person_post
    measures:
      - person_dynamic_sales_rate
      - person_sale_amount
      - person_sale_achieve_rate
      - person_gd_amount
      - person_gd_achieve_rate
      - person_heli3_new_num
      - person_heli3_new_achieve_rate
      - person_jc_qc_sale_amount
      - person_qc_new_num
      - person_benefit_binding_num
    notes:
      - 一人一行：person_code/person_name 是销售代表；person_post 目前主要是"销售代表"。
      - 该表是日全量快照（生产按 ds 分区，MySQL 只同步最新一份 ds）；acc_month 为会计月，相对时间（本月/上月）按 MAX(acc_month) 解析，无需也不要按 ds 过滤。
      - person_code/person_name 为 NULL 的行是"地区下无归属人员的门店"兜底桶（多为 0 值），是可加的明细而非小计；只看实际销售代表时加 person_code IS NOT NULL。
      - 计数/金额类指标可直接 SUM；达成率/动销率用"分子之和 / 分母之和"（见各 metric expression）。
      - 大量 *_current_month_avg_day(当月日均)、*_before_3m_avg_day(前三月日均)、*_last_month(上月) 为预计算列可加和；而 *_rank(排名)、*_diff(对比上一级差异) 是逐行对比产物，不要跨行聚合。
      - heli3_new_achieve_rate(鹤礼3新客达成率) 的分子用 heli3_num_brand(鹤礼3.0新客_品牌品)，非 heli3_new_num，与生产预计算列一致。

# ----------------------------------------------------------------
# 维度 dimensions
# ----------------------------------------------------------------
dimensions:

  region:
    label: 大区
    aliases: [大区, 区域, 战区, 一级区域]
    table_columns:
      ads_bi_hs_sale_info_df: lev2_name
      ads_bi_month_shop_item_dan_summary_df: lev2_name
      ads_bi_month_shop_item_dan_detail_df: lev2_name
      ads_bi_month_shop_item_dan_target_summary_df: lev2_name
      ads_member_first_purchase_new_customer_total_df: lev2_name
      ads_precision_nutrition_potential_total_df: lev2_name
      ads_bi_awake_person_index_summary_df: lev2_name
    sample_values: [东一区, 中一区, 中二区, 北一区, 南一区, 南二区, 西一区, 西二区, 直辖区]
    description: 飞鹤销售区域第一层（生产实际 9 个大区：东一/中一/中二/北一/南一/南二/西一/西二/直辖）

  sub_region:
    label: 省区
    aliases: [省区, 省份区域, 二级区域]
    table_columns:
      ads_bi_hs_sale_info_df: lev3_name
      ads_bi_month_shop_item_dan_summary_df: lev3_name
      ads_bi_month_shop_item_dan_detail_df: lev3_name
      ads_bi_month_shop_item_dan_target_summary_df: lev3_name
      ads_member_first_purchase_new_customer_total_df: lev3_name
      ads_precision_nutrition_potential_total_df: lev3_name
      ads_bi_awake_person_index_summary_df: lev3_name
    sample_values:
      - 甘肃
      - 新疆
      - 豫北
      - 云南
      - 川南
      - 晋北
      - 贵州
      - 皖南
      - 皖北
      - 湘北
      - 福建
      - 赣北
      - 吉林
      - 桂北
      - 桂南
      - 川北
      - 赣南
      - 鄂东
      - 湘南
      - 鄂西
      - 苏北
      - 陕二
      - 粤北
      - 浙南
      - 粤东
      - 晋南
      - 苏南
      - 浙北
      - 陕一
      - 辽东
      - 鲁西
      - 黑东
      - 鲁中
      - 辽西
      - 鲁东
      - 豫东
      - 黑西
      - 冀北
      - 粤西
      - 冀南
      - 粤中
      - 重庆
      - 鲁北
      - 豫中
      - 豫南
      - 川中
      - 海南
      - 冀中
      - 天津
      - 上海
    description: 飞鹤销售区域第二层（生产 50+ 个省区，按销售记录量降序的真实命名；非"行政省"概念，是飞鹤内部行政划分）

  province:
    label: 省份
    aliases: [省, 省份, 行政省, 行政区划]
    table_columns:
      ads_bi_month_shop_item_dan_detail_df: province
    sample_values:
      - 河南省
      - 广东省
      - 山东省
      - 四川省
      - 湖南省
      - 安徽省
      - 广西壮族自治区
      - 河北省
      - 江苏省
      - 浙江省
    description: 标准行政省份名（detail 表独有；与 sub_region 不同，sub_region 是飞鹤内部省区划分）

  city:
    label: 城市
    aliases: [城市, 行政市, 地级市]
    table_columns:
      ads_bi_hs_sale_info_df: official_city
      ads_bi_month_shop_item_dan_summary_df: city
      ads_bi_month_shop_item_dan_detail_df: city
    sample_values:
      - 市辖区
      - 省直辖县级行政区划
      - 宜春市
      - 开封市
      - 临沂市
      - 温州市
      - 九江市
      - 成都市
      - 徐州市
      - 聊城市
      - 滁州市
      - 赣州市
      - 商丘市
      - 长沙市
      - 抚州市
      - 南宁市
      - 晋中市
      - 广州市
      - 菏泽市
      - 重庆郊县
      - 西安市
      - 长春市
      - 湛江市
      - 邵阳市
      - 六安市
    description: 行政市/城市级别（生产实际 335 个城市，含特殊取值"市辖区"/"省直辖县级行政区划"代表少数民族州县/直辖区辖区）

  channel_type:
    label: 渠道类型
    aliases: [渠道, 销售渠道, 渠道编码]
    table_columns:
      ads_bi_hs_sale_info_df: channel_type
    value_dict:
      "1": 母婴店
      "2": KA超市
      "3": 电商
      "4": 母婴大客户
      "13": 其他渠道-13
      "14": 其他
      "16": 其他渠道-16
      "21": 其他渠道-21
    description: |
      销售业务渠道类型代码（生产实际出现 7 种：1/2/3/13/14/16/21）。
      字典映射中 13/16/21 业务侧未提供权威译名；如需准确分组，建议直接用 code 过滤。

  big_system_channel:
    label: 大系统渠道
    aliases: [大系统, 渠道系统, 渠道客户, 大系统渠道名称]
    table_columns:
      ads_bi_month_shop_item_dan_summary_df: big_system_channel_name
      ads_bi_month_shop_item_dan_detail_df: big_system_channel_name
      ads_bi_month_shop_item_dan_target_summary_df: big_system_channel_name
      ads_member_first_purchase_new_customer_total_df: big_system_channel_name
      ads_precision_nutrition_potential_total_df: big_system_channel_name
    sample_values: [省区常规, RKSC渠道, NKA渠道, KSC西区, KSC东区]
    description: 大系统渠道（生产实际 5 个：省区常规 / RKSC渠道 / NKA渠道 / KSC西区 / KSC东区）

  shop_type:
    label: 门店类型
    aliases: [门店类别]
    table_columns:
      ads_bi_hs_sale_info_df: shop_type
    sample_values: [专职门店, 无导门店, B类门店, 返利账号门店]
    description: 飞鹤门店类型（生产实际 4 种）

  shop:
    label: 门店
    aliases: [门店, 店铺, 终端门店]
    table_columns:
      ads_bi_hs_sale_info_df: shop_name
      ads_bi_month_shop_item_dan_detail_df: shop_name
    description: 单门店名称（生产 detail 表里 10 万+ 不同 shop_code，103K+ 不同 shop_name；汇总表无此维度，要看具体门店必须用 detail 表）
    code_column:
      ads_bi_hs_sale_info_df: shop_code
      ads_bi_month_shop_item_dan_detail_df: shop_code

  guide:
    label: 导购
    aliases: [导购, 导购员, 营业员]
    table_columns:
      ads_bi_hs_sale_info_df: guide_name
    description: 门店导购姓名
    code_column:
      ads_bi_hs_sale_info_df: guide_code

  dealer:
    label: 经销商
    aliases: [经销商, 客户]
    table_columns:
      ads_bi_hs_sale_info_df: dealer_name
    description: 经销商客户名称
    code_column:
      ads_bi_hs_sale_info_df: dealer_code

  item:
    label: 产品
    aliases: [产品, 商品, SKU]
    table_columns:
      ads_bi_hs_sale_info_df: item_name
    description: 产品（SKU）名称
    code_column:
      ads_bi_hs_sale_info_df: item_code

  item_series:
    label: 产品系列
    aliases: [产品系列, 系列, 品系, 产品线]
    table_columns:
      ads_bi_hs_sale_info_df: item_series_new
      ads_bi_month_shop_item_dan_summary_df: item_series_new_name
      ads_bi_month_shop_item_dan_detail_df: item_series_new_name
    sample_values:
      - 星飞帆-卓睿
      - 星飞帆经典1-3段
      - 星飞帆卓耀
      - 臻稚卓蓓
      - 飞帆
      - 臻爱倍护-控店
      - 星飞帆卓睿Pro
      - 星飞帆900g
      - 星飞帆卓初
      - 臻爱飞帆A2
      - 臻爱倍护-全渠道
      - 星飞帆A2
      - 星飞帆有机A2奶源版
      - 星蕴
      - 精粹益加A2
      - 星飞帆小羊
      - 星飞帆经典4段
      - 臻爱星萃A2
      - 星飞帆有机奶源版
      - 茁然-茁护
      - 臻爱跃护A2
      - 小羊妙可
      - 臻爱倍护有机奶源版
      - 星飞帆卓舒
      - 星飞帆卓睿4段
      - 飞鹤迹萃
      - 星飞帆卓耀铂金（有机A2 β-酪蛋白）
      - 淳芮有机
      - 星飞帆卓初A2中国红
      - 星飞帆卓耀蓝钻（有机）
      - 茁然-奶粉4段
      - 飞鹤牧场-经典
      - 臻稚经典1-3段
      - 经典爱本-牛
      - 经典1962-金装
    description: |
      飞鹤产品系列（生产实际 80+ 种，按销售记录量降序取前 35 为最有代表性值）。
      系列名常含中文括号和特殊字符（如 "（有机A2 β-酪蛋白）"），匹配时注意全角字符。

  item_dan:
    label: 段位
    aliases: [段位, 产品段位, 配方段位, 段次]
    table_columns:
      ads_bi_hs_sale_info_df: item_stage
      ads_bi_month_shop_item_dan_summary_df: item_dan_name
      ads_bi_month_shop_item_dan_detail_df: item_dan_name
      ads_member_first_purchase_new_customer_total_df: item_dan_name
    sample_values: [1段, 2段, 3段, 4段, 0段, 成人, 空段]
    description: |
      婴幼儿配方奶粉的段位划分。
      summary/detail 表实际取值：0段/1段/2段/3段/4段/空段；
      sale_info 表的 item_stage 字段额外有"成人"/"其他"（属于不同的产品系列体系）。

  item_spec:
    label: 产品规格
    aliases: [规格, 罐型]
    table_columns:
      ads_bi_hs_sale_info_df: item_spec
    sample_values: [大听, 中听, 小听]
    description: 罐装规格

  terminal_circle:
    label: 圈层等级
    aliases: [圈层, 终端圈层, 终端等级, 圈子]
    table_columns:
      ads_bi_month_shop_item_dan_summary_df: terminal_circle_level
      ads_bi_month_shop_item_dan_detail_df: terminal_circle_level
    sample_values:
      - 潜力终端-流通品
      - 潜力终端-定制品
      - 闭环圈子
      - 平台型-NKA
      - 平台型-LKA/LC
      - 加盟型大系统KSC西区
      - 平台型-KSC东区
    description: 终端门店圈层分级（生产实际 7 种，按销售记录量降序）

  business_representative:
    label: 业务代表
    aliases: [业务代表, BR]
    table_columns:
      ads_bi_hs_sale_info_df: business_representative_name
    code_column:
      ads_bi_hs_sale_info_df: business_representative_code

  area_manager:
    label: 地区经理
    aliases: [地区经理, 经理]
    table_columns:
      ads_bi_hs_sale_info_df: lev4_name_manager_name
    code_column:
      ads_bi_hs_sale_info_df: lev4_name_manager_code

  is_guide_shop:
    label: 是否有导门店
    aliases: [有导, 是否有导]
    table_columns:
      ads_bi_hs_sale_info_df: is_guide_shop
    sample_values: ["是", "否"]

  # ---- 激活一线人员表 / 明细表新增维度 ----
  salesperson:
    label: 销售代表
    aliases: [销售代表, 人员, 业务员, 一线人员, 营销人员, 人员名称, 员工]
    table_columns:
      ads_bi_awake_person_index_summary_df: person_name
    code_column:
      ads_bi_awake_person_index_summary_df: person_code
    sample_values: [李季昆, 邵军建, 顾顺, 李旭, 孙肖, 杨克, 刘刚]
    description: 激活一线人员（销售代表）姓名，person_code 为人员编码。仅 ads_bi_awake_person_index_summary_df 有人员粒度。

  person_post:
    label: 人员岗位
    aliases: [人员岗位, 岗位, 职位]
    table_columns:
      ads_bi_awake_person_index_summary_df: person_post
    sample_values: [销售代表]
    description: 一线人员岗位，目前主要为"销售代表"。

  district:
    label: 地区
    aliases: [地区, 地区名称, 四级区域, lev4]
    table_columns:
      ads_bi_month_shop_item_dan_detail_df: lev4_name
      ads_bi_awake_person_index_summary_df: lev4_name
    sample_values: [宿迁东, 徐州中, 淄博]
    description: 飞鹤销售区域第四层（地区）；层级为 lev2 大区 > lev3 省区 > lev4 地区。明细表与人员表均有此列。

  chainstore:
    label: 连锁系统
    aliases: [连锁系统, 连锁, 连锁系统名称, 连锁客户]
    table_columns:
      ads_bi_month_shop_item_dan_detail_df: chainstore_name
    code_column:
      ads_bi_month_shop_item_dan_detail_df: chainstore_code
    description: 门店所属连锁系统名称（明细表特有；很多门店该字段为空 NULL）。

  channel_grade:
    label: 渠道等级
    aliases: [渠道等级, 渠道名称]
    table_columns:
      ads_bi_month_shop_item_dan_detail_df: channel_type
    sample_values: [SC]
    description: 明细表的渠道等级/渠道名称（如 SC）；与火山POC表 channel_type(母婴店/KA 等数字代码) 是完全不同的口径，勿混用。

  product_tier:
    label: 产品品类
    aliases: [产品品类, 品牌品, 流通品, 品牌产品, 流通产品]
    table_columns:
      ads_bi_month_shop_item_dan_detail_df: terminal_circle_level
    sample_values: [品牌产品, 流通产品]
    description: |
      明细表 terminal_circle_level 列在当前快照取值为 品牌产品/流通产品（产品品类层级），
      与 summary 表"圈层等级"(潜力终端-流通品/闭环圈子…)口径不同；按品牌品/流通品筛选时用此维度。

# ----------------------------------------------------------------
# 时间维度（特殊处理）
# ----------------------------------------------------------------
time_dimensions:
  acc_month:
    label: 会计月
    table_columns:
      ads_bi_hs_sale_info_df: acc_month
      ads_bi_awake_person_index_summary_df: acc_month
    granularity: month
    format: "YYYY-MM"
  ym_year_month:
    label: 年-月
    composite: true
    table_columns:
      ads_bi_month_shop_item_dan_summary_df: [year, month]
      ads_bi_month_shop_item_dan_detail_df: [year, month]
      ads_bi_month_shop_item_dan_target_summary_df: [year, month]
      ads_member_first_purchase_new_customer_total_df: [year, month]
      ads_precision_nutrition_potential_total_df: [year, month]
    granularity: month
    format: "year=YYYY AND month=MM"

# ----------------------------------------------------------------
# 指标 metrics
# ----------------------------------------------------------------
metrics:

  # ===== 销售额类（管理层最常问） =====
  terminal_sale_amount_total:
    label: 终端销售额
    aliases: [终端销售额, 终端销售金额, 销售额, 销售金额, 业绩, 营收, 销售实绩]
    table: ads_bi_month_shop_item_dan_summary_df
    expression: "SUM(terminal_sale_amount)"
    unit: 元
    display_format: currency_cn
    decimals: 2
    higher_is_better: true
    description: 终端门店实际销售给消费者的金额合计。是飞鹤管理层默认的"销售额"主指标。
    domain: sales
    typical_dimensions: [region, sub_region, city, big_system_channel, item_series, item_dan, terminal_circle]
    typical_questions:
      - 本月销售额怎么样
      - 各大区销售排名
      - 卓睿系列销售如何

  shop_sale_amount_total:
    label: 门店销售金额
    aliases: [门店销售额, 门店业绩, 门店销售]
    table: ads_bi_hs_sale_info_df
    expression: "SUM(shop_sale_amount)"
    unit: 元
    display_format: currency_cn
    decimals: 2
    higher_is_better: true
    description: 来自火山POC销售明细的门店销售金额。当用户需要下钻到门店、导购、单产品级时使用。
    domain: sales
    typical_dimensions: [region, sub_region, city, channel_type, shop_type, dealer, shop, guide, item_series, item_stage, item]
    typical_questions:
      - 哪些导购卖得最好
      - 某个门店的销售情况

  shop_sale_qty_total:
    label: 门店销售件数
    aliases: [销售件数, 销量, 销售数量]
    table: ads_bi_hs_sale_info_df
    expression: "SUM(shop_sale_qty)"
    unit: 件
    display_format: integer_cn
    decimals: 0
    higher_is_better: true
    description: 来自火山POC销售明细的门店销售件数。
    domain: sales
    typical_dimensions: [region, sub_region, city, channel_type, item_series, item_stage, item]

  gd_amount_total:
    label: 过单金额（明细）
    aliases: [过单金额, 经销商过单, 订货金额]
    table: ads_bi_hs_sale_info_df
    expression: "SUM(gd_amount)"
    unit: 元
    display_format: currency_cn
    description: 火山POC明细表的过单金额合计。当用户问"经销商订货"、"过单额"时使用。
    domain: distribution

  reduction_gd_sale_amount_total:
    label: 还原过单金额（不含货补）
    aliases: [还原过单金额, 还原过单销售额, 还原过单, 过单额, 经销商过单额, 不含货补过单]
    table: ads_bi_month_shop_item_dan_summary_df
    expression: "SUM(reduction_gd_sale_amount)"
    unit: 元
    display_format: currency_cn
    description: 月度汇总表的还原过单金额（不含货补）。高管常用的"过单"主指标。
    domain: distribution
    typical_dimensions: [region, sub_region, city, big_system_channel, item_series, item_dan, terminal_circle]

  avg_unit_price:
    label: 件单价
    aliases: [件单价, 单价, 客单价, 平均单价, 每件金额]
    table: ads_bi_hs_sale_info_df
    expression: "SUM(shop_sale_amount) / NULLIF(SUM(shop_sale_qty), 0)"
    unit: 元
    display_format: currency_cn
    decimals: 2
    higher_is_better: true
    domain: sales
    description: 门店销售金额 / 门店销售件数，反映平均成交价格。
    typical_dimensions: [region, sub_region, city, channel_type, item_series, item_stage, item]
    typical_questions:
      - 各大区件单价对比
      - 哪个系列件单价最高

  # ===== 目标与达成率 =====
  shop_sale_target_total:
    label: 门店销售目标
    aliases: [销售目标, 月度销售目标]
    table: ads_bi_month_shop_item_dan_target_summary_df
    expression: "SUM(shop_sale_target)"
    unit: 元
    display_format: currency_cn
    domain: target
    description: 月度下达的门店销售目标。
    typical_dimensions: [region, sub_region, big_system_channel]
    typical_questions:
      - 各大区销售目标完成情况
      - 本月销售目标是多少

  shop_sale_amount_actual_total:
    label: 门店销售实绩（目标表口径）
    aliases: [销售实绩, 实际销售]
    table: ads_bi_month_shop_item_dan_target_summary_df
    expression: "SUM(shop_sale_amount)"
    unit: 元
    display_format: currency_cn
    domain: target

  gd_target_total:
    label: 过单目标
    aliases: [过单目标, 经销商订货目标]
    table: ads_bi_month_shop_item_dan_target_summary_df
    expression: "SUM(gd_target)"
    unit: 元
    display_format: currency_cn
    domain: target

  gd_amount_actual_total:
    label: 过单实绩（目标表口径）
    aliases: [过单实绩, 实际过单]
    table: ads_bi_month_shop_item_dan_target_summary_df
    expression: "SUM(gd_amount)"
    unit: 元
    display_format: currency_cn
    domain: target

  shop_sale_achievement_rate:
    label: 门店销售达成率
    aliases: [门店达成率, 销售达成率, 达成率]
    table: ads_bi_month_shop_item_dan_target_summary_df
    expression: "SUM(shop_sale_amount) / NULLIF(SUM(shop_sale_target), 0)"
    unit: "%"
    display_format: percent
    decimals: 2
    higher_is_better: true
    domain: target
    typical_dimensions: [region, sub_region, big_system_channel]
    description: 销售实绩 / 销售目标，反映完成情况。

  gd_achievement_rate:
    label: 过单达成率
    aliases: [过单达成率, 订货达成率]
    table: ads_bi_month_shop_item_dan_target_summary_df
    expression: "SUM(gd_amount) / NULLIF(SUM(gd_target), 0)"
    unit: "%"
    display_format: percent
    decimals: 2
    higher_is_better: true
    domain: target

  # ===== 新客与复购 =====
  first_purchase_num_total:
    label: 首购人数
    aliases: [首购人数, 新客数, 首单人数]
    table: ads_member_first_purchase_new_customer_total_df
    expression: "SUM(first_purchase_num)"
    unit: 人
    display_format: integer_cn
    domain: member
    higher_is_better: true
    typical_dimensions: [region, sub_region, big_system_channel, item_dan]
    typical_questions:
      - 各大区首购新客人数
      - 本月新客数趋势

  repurchase_in_60_days_num_total:
    label: 60天复购人数
    aliases: [60天复购, 复购人数]
    table: ads_member_first_purchase_new_customer_total_df
    expression: "SUM(repurchase_in_60_days_num)"
    unit: 人
    display_format: integer_cn
    domain: member
    higher_is_better: true

  repurchase_rate_60d:
    label: 60天复购率
    aliases: [复购率, 60天复购率]
    table: ads_member_first_purchase_new_customer_total_df
    expression: "SUM(repurchase_in_60_days_num) / NULLIF(SUM(first_purchase_num), 0)"
    unit: "%"
    display_format: percent
    decimals: 2
    domain: member
    higher_is_better: true

  heli30_new_customer_num_total:
    label: 鹤礼3.0新客数
    aliases: [鹤礼3.0新客数, 鹤礼3.0新客, 鹤礼新客数, 鹤礼新客, 鹤礼3新客数]
    table: ads_member_first_purchase_new_customer_total_df
    expression: "SUM(heli30_new_customer_num)"
    unit: 人
    display_format: integer_cn
    domain: member
    higher_is_better: true

  heli30_repurchase_in_60_days_num_total:
    label: 鹤礼3.0 60天复购数
    # 别名故意收录"鹤礼3.060天复购数"（无空格）——用户口语常把 3.0 与 60 连写，
    # 而 label 里有空格，子串匹配匹配不到；不补这条别名就会回落到通用 60 天复购指标（审计 case 7）。
    aliases: [鹤礼3.060天复购数, 鹤礼3.0复购数, 鹤礼复购数, 鹤礼3.060天复购人数, 鹤礼60天复购数, 鹤礼3.0 60天复购数]
    table: ads_member_first_purchase_new_customer_total_df
    expression: "SUM(heli30_repurchase_in_60_days_num)"
    unit: 人
    display_format: integer_cn
    domain: member
    higher_is_better: true

  heli30_repurchase_rate_60d:
    label: 鹤礼3.0 60天复购率
    # 审计 case 7 缺这一指标：原来"鹤礼3.0…复购率"只能落到通用 repurchase_rate_60d，
    # 口径错成 普通60天复购/首购。鹤礼3.0 复购率必须用鹤礼自己的分子分母。
    aliases: [鹤礼3.0复购率, 鹤礼3.060天复购率, 鹤礼复购率, 鹤礼3.0 60天复购率, 鹤礼60天复购率]
    table: ads_member_first_purchase_new_customer_total_df
    expression: "SUM(heli30_repurchase_in_60_days_num) / NULLIF(SUM(heli30_new_customer_num), 0)"
    unit: "%"
    display_format: percent
    decimals: 2
    domain: member
    higher_is_better: true

  # ===== 精准营养 =====
  potential_num_total:
    label: 精准潜客人数
    aliases: [精准潜客, 潜客人数]
    table: ads_precision_nutrition_potential_total_df
    expression: "SUM(potential_num)"
    unit: 人
    display_format: integer_cn
    domain: marketing

  potential_to_new_num_total:
    label: 潜客转新客人数
    aliases: [转新人数, 潜客转化]
    table: ads_precision_nutrition_potential_total_df
    expression: "SUM(potential_to_new_num)"
    unit: 人
    display_format: integer_cn
    domain: marketing

  potential_to_new_rate:
    label: 潜客转新率
    # "转新率"/"转新"是用户最常用的口语（审计 case 8/12 全因缺这条别名落不到本指标）。
    aliases: [转新率, 转新, 转化率, 潜客转化率, 潜客转新率, 转新客率]
    table: ads_precision_nutrition_potential_total_df
    expression: "SUM(potential_to_new_num) / NULLIF(SUM(potential_num), 0)"
    unit: "%"
    display_format: percent
    decimals: 2
    domain: marketing
    higher_is_better: true
    typical_dimensions: [region, sub_region, big_system_channel]
    typical_questions:
      - 各大区潜客转新率
      - 精准营养转化率怎么样

  # ===== 激活一线人员指标（ads_bi_awake_person_index_summary_df，人员/销售代表粒度） =====
  # 计数/金额 → SUM 可加；达成率/动销率 → 分子之和/分母之和（已按生产预计算列校验）；
  # 复购率/铺市率/企微完成率/回访率等用快照列 AVG 近似（单人查询精确，分组为非加权均值）。

  person_management_shop_qty:
    label: 管理门店数
    aliases: [管理门店数, 管理门店数量, 人员管理门店数, 负责门店数]
    table: ads_bi_awake_person_index_summary_df
    expression: "SUM(management_shop_qty)"
    unit: 家
    display_format: integer_cn
    decimals: 0
    domain: activation
    description: 销售代表管理的门店数量。

  person_allow_sales_shop_qty:
    label: 允销门店数
    aliases: [允销门店数, 允销门店数量, 允销门店]
    table: ads_bi_awake_person_index_summary_df
    expression: "SUM(allow_sales_shop_qty)"
    unit: 家
    display_format: integer_cn
    decimals: 0
    domain: activation
    description: 允许销售的门店数量（动销率分母）。

  person_dynamic_sales_shop_qty:
    label: 动销门店数
    aliases: [动销门店数, 动销门店数量, 动销门店]
    table: ads_bi_awake_person_index_summary_df
    expression: "SUM(dynamic_sales_shop_qty)"
    unit: 家
    display_format: integer_cn
    decimals: 0
    domain: activation
    description: 当月产生动销（有销售）的门店数量（动销率分子）。

  person_dynamic_sales_rate:
    label: 动销率
    aliases: [动销率, 人员动销率, 门店动销率, 销售代表动销率]
    table: ads_bi_awake_person_index_summary_df
    expression: "SUM(dynamic_sales_shop_qty) / NULLIF(SUM(allow_sales_shop_qty), 0)"
    unit: "%"
    display_format: percent
    decimals: 2
    higher_is_better: true
    domain: activation
    description: 动销门店数 / 允销门店数，衡量门店激活程度。一线核心指标，仅人员表有。
    typical_dimensions: [region, sub_region, district, salesperson]
