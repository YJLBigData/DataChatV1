# DataChatV1 反向代理 —— 容量方案 P0-8：SSE 不被缓冲/截断 + /metrics 内网白名单。
# 安装：sudo cp deploy/nginx/datachatv1.conf /etc/nginx/conf.d/datachatv1.conf
#       sudo nginx -t && sudo systemctl reload nginx
#
# 关键点：
#   · proxy_buffering off + gzip off：SSE(text/event-stream) 必须逐块下发，否则前端流式问数会"卡到结束才一次性出"。
#   · proxy_read_timeout 120s：必须 > LLM read timeout(90s)，否则慢调用会被代理层提前断开。
#   · /metrics 仅内网：运行指标属内部信息，不对公网裸放。

upstream datachatv1_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name datachatv1.feihe.com;  # 按实际域名调整

    # 生产建议跳转 HTTPS（证书就绪后取消注释）：
    # return 301 https://$host$request_uri;

    client_max_body_size 50m;          # 文件上传（python-multipart）

    # ---- /metrics：仅内网可拉 ----
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://datachatv1_backend;
        proxy_set_header Host $host;
    }

    # ---- 业务 + SSE 流式问数 ----
    location / {
        proxy_pass http://datachatv1_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;     # > LLM_READ_TIMEOUT(90s)

        # SSE：关闭一切缓冲/压缩（后端已发 X-Accel-Buffering: no，这里再兜一层）
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }
}

